<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#060208" />
    <meta
      name="description"
      content="Uma composição tipográfica animada: um coração formado por declarações de amor em 20 idiomas."
    />
    <title>LoveYou — Coração Tipográfico</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main class="stage" aria-labelledby="page-title">
      <h1 id="page-title" class="visually-hidden">
        Um coração formado por declarações de amor em 20 idiomas
      </h1>
      <canvas
        id="love-heart"
        class="heart-canvas"
        width="800"
        height="800"
        role="img"
        aria-label="Animação de um coração vermelho composto por frases de amor em vinte idiomas, sobre fundo escuro."
      >
        Seu navegador não oferece suporte ao canvas usado para desenhar o coração.
      </canvas>
      <noscript>
        <p class="noscript-note">Ative o JavaScript para ver a animação do coração.</p>
      </noscript>
    </main>
  </body>
</html>
